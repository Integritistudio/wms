services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-shipoo_ms}
    # Host 8713 → container 5432 (change left side if busy)
    ports:
      - '${DB_PUBLISH_PORT:-8713}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'dist/main.js']
    env_file:
      - .env
    environment:
      # Inside Docker network always use the service name + internal port
      DB_HOST: postgres
      DB_PORT: 5432
      SERVER_PORT: ${SERVER_PORT:-8712}
      RUN_MIGRATIONS: 'true'
    ports:
      - '${SERVER_PORT:-8712}:${SERVER_PORT:-8712}'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'dist/worker.main.js']
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      RUN_MIGRATIONS: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
