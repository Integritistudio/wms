services:
  postgres:
    image: postgres:16-alpine
    container_name: linker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - linker_pg_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: linker-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: linker
      RABBITMQ_DEFAULT_PASS: linker
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - linker_rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  linker_pg_data:
  linker_rabbit_data:
