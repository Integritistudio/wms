services:
  api:
    build: .
    command: ['node', 'dist/main.js']
    env_file: [.env]
    environment:
      SERVER_PORT: ${SERVER_PORT:-8720}
      RUN_MIGRATIONS: 'true'
    ports:
      - '${SERVER_PORT:-8720}:${SERVER_PORT:-8720}'
    restart: unless-stopped

  worker:
    build: .
    command: ['node', 'dist/worker.main.js']
    env_file: [.env]
    environment:
      RUN_MIGRATIONS: 'false'
    depends_on: [api]
    restart: unless-stopped
